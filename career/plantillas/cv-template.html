<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Curriculum Vitae</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Inter",sans-serif;font-size:11pt;line-height:1.5;color:#1a1a2e;background:#fff}
  .page{max-width:820px;margin:0 auto;padding:28px 36px}
  /* Header */
  .header{border-bottom:3px solid #2563eb;padding-bottom:14px;margin-bottom:18px}
  .name{font-size:24pt;font-weight:700;color:#1e3a5f;letter-spacing:-0.5px}
  .headline{font-size:11.5pt;color:#2563eb;font-weight:500;margin-top:3px}
  .contacts{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:9.5pt;color:#555}
  .contacts span::before{content:"• ";color:#2563eb}
  .contacts span:first-child::before{content:""}
  /* Sections */
  .section{margin-bottom:16px}
  .section-title{font-size:10pt;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;
    color:#2563eb;border-bottom:1px solid #dbeafe;padding-bottom:3px;margin-bottom:10px}
  /* Summary */
  .summary{font-size:10.5pt;color:#333;line-height:1.6;background:#f0f7ff;
    padding:10px 14px;border-left:3px solid #2563eb;border-radius:0 4px 4px 0}
  /* Experience */
  .experience-item{margin-bottom:12px}
  .exp-header{display:flex;justify-content:space-between;align-items:baseline}
  .company{font-weight:700;font-size:11pt;color:#1e3a5f}
  .period{font-size:9pt;color:#777;font-weight:400}
  .role{font-size:10.5pt;color:#2563eb;font-weight:500;margin:1px 0 4px}
  .experience-item p{font-size:10pt;color:#444;margin-bottom:4px}
  .experience-item ul{padding-left:16px}
  .experience-item li{font-size:10pt;color:#333;margin-bottom:2px}
  /* Projects */
  .project-item{margin-bottom:10px}
  .project-item strong{color:#1e3a5f;font-size:10.5pt}
  .project-item p{font-size:10pt;color:#444;margin-top:2px}
  /* Skills */
  .skills-bar{display:flex;flex-wrap:wrap;gap:6px}
  .skill-tag{background:#dbeafe;color:#1e3a5f;padding:3px 9px;border-radius:12px;
    font-size:9pt;font-weight:500}
  /* Education */
  .education-item{font-size:10pt;color:#333;margin-bottom:4px}
  /* ATS safe: no hidden text, no graphics */
  @media print{body{font-size:10.5pt}.page{padding:20px 28px}}
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="name">{{NOMBRE}}</div>
    <div class="headline">{{TITULAR}}</div>
    <div class="contacts">
      <span>{{EMAIL}}</span>
      <span>{{TELEFONO}}</span>
      <span>{{UBICACION}}</span>
      <span>{{LINKEDIN}}</span>
      <span>{{PORTFOLIO}}</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Perfil Profesional</div>
    <div class="summary">{{RESUMEN}}</div>
  </div>

  <div class="section">
    <div class="section-title">Experiencia</div>
    {{EXPERIENCIA}}
  </div>

  <div class="section">
    <div class="section-title">Proyectos Destacados</div>
    {{PROYECTOS}}
  </div>

  <div class="section">
    <div class="section-title">Habilidades Tecnicas</div>
    <div class="skills-bar">{{SKILLS}}</div>
  </div>

  <div class="section">
    <div class="section-title">Formacion</div>
    <div class="education-item">{{EDUCACION}}</div>
  </div>

</div>
</body>
</html>
