# ─────────────────────────────────────────────────────────────────────────────
# GitHub Actions — Deploy via Tailscale
# Conecta de forma segura al servidor mayk (${{ secrets.HOST_IP }}) y despliega
# el stack Docker sin exponer ningún puerto a internet público.
# Disparador: push a main en mayk-orchestrators
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy via Tailscale

on:
  push:
    branches: [main]
  workflow_dispatch:  # Permite lanzarlo manualmente desde GitHub UI

jobs:
  deploy:
    name: Deploy mayk.dev Stack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout del código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Conectar al túnel Tailscale (ephemeral — se desconecta al terminar el job)
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci


      # 3. Configurar SSH con la clave privada
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOST_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      # 4. Copiar archivos al servidor via SCP (solo los necesarios)
      - name: Copy files to server
        run: |
          scp -o StrictHostKeyChecking=no -r \
            docker-compose.yml \
            Makefile \
            pweb/ \
            mayk@${{ secrets.HOST_IP }}:/home/mayk/mayk-dev/

      # 5. Aplicar migraciones SQL en Supabase (idempotente — IF NOT EXISTS)
      - name: Run Supabase Migrations
        continue-on-error: true   # Las tablas ya existen; no bloquear el deploy si falla
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MIGRATIONS_DIR:      pweb/supabase/migrations
        run: |
          pip install requests --quiet
          python3 pweb/supabase/run_migrations.py || true


      # 6. Clonar mayk-agents (repo privado) en el runner y copiarlo al servidor via SCP
      - name: Checkout mayk-agents
        uses: actions/checkout@v4
        with:
          repository: MaykNLD/mayk-agents
          token: ${{ secrets.GH_PAT }}
          path: mayk-agents-repo

      - name: Copy mayk-agents to server
        run: |
          # Eliminar .git para que scp no intente copiar los objetos de solo lectura
          rm -rf mayk-agents-repo/.git
          ssh -o StrictHostKeyChecking=no mayk@${{ secrets.HOST_IP }} "rm -rf /home/mayk/mayk-agents && mkdir -p /home/mayk/mayk-agents"
          scp -o StrictHostKeyChecking=no -r mayk-agents-repo/. mayk@${{ secrets.HOST_IP }}:/home/mayk/mayk-agents/

      # 7. Ejecutar docker-compose en el servidor via SSH
      #    Las variables se inyectan como env vars desde GitHub Secrets
      - name: Deploy Docker stack
        run: |
          ssh -o StrictHostKeyChecking=no mayk@${{ secrets.HOST_IP }} bash << 'ENDSSH'
            set -e

            # Hotfix para que los Dockerfiles de los agentes toleren compilarse con scope de su propia carpeta
            cd /home/mayk/mayk-agents
            for d in agente-*/; do
              cp -r shared $d/shared || true
              sed -i 's|\.\./shared|shared|g' $d/Dockerfile
            done

            cd /home/mayk/mayk-dev

            # Inyectar secrets como variables de entorno (solo en memoria del proceso)
            export OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}"
            export SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
            export SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
            export SUPABASE_SECRET_KEY="${{ secrets.SUPABASE_SECRET_KEY }}"
            export MAKE_WEBHOOK_URL="${{ secrets.MAKE_WEBHOOK_URL }}"

            # Rebuild y reinicio del stack
            docker compose up -d --build --remove-orphans

            # Verificar que todos los servicios levantaron
            docker compose ps
          ENDSSH


      # 6. Verificar salud del orquestador (espera 10s para que arranquen los contenedores)
      - name: Health check via Tailscale
        run: |
          sleep 10
          curl -f http://${{ secrets.HOST_IP }}:8000/health || exit 1
          echo "Orquestador operativo."

      # 7. Verificar todos los agentes
      - name: Agents health check
        run: |
          curl -s http://${{ secrets.HOST_IP }}:8000/agents/health
