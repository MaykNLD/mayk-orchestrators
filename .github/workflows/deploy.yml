name: Deploy via Tailscale

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy mayk.dev Stack
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Checkout del código del orquestador
      - name: Checkout orchestrator code
        uses: actions/checkout@v4

      # 2. Conectar al túnel Tailscale
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci

      # 3. Configurar SSH
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOST_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      # 4. Verificar conectividad SSH antes de continuar
      - name: Verify SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa mayk@${{ secrets.HOST_IP }} "echo 'SSH OK && hostname'"

      # 5. Copiar el orquestador al servidor
      - name: Copy orchestrator to server
        run: |
          ssh -o StrictHostKeyChecking=no mayk@${{ secrets.HOST_IP }} "mkdir -p /home/mayk/mayk-dev"
          scp -o StrictHostKeyChecking=no docker-compose.yml mayk@${{ secrets.HOST_IP }}:/home/mayk/mayk-dev/
          scp -o StrictHostKeyChecking=no -r pweb mayk@${{ secrets.HOST_IP }}:/home/mayk/mayk-dev/
          scp -o StrictHostKeyChecking=no -r career mayk@${{ secrets.HOST_IP }}:/home/mayk/mayk-dev/

      # 6. Clonar mayk-agents y desplegar TODO en un único script SSH
      #    (evita race conditions entre comandos SSH separados)
      - name: Deploy everything on server
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ssh -o StrictHostKeyChecking=no mayk@${{ secrets.HOST_IP }} \
            GH_PAT="$GH_PAT" \
            OPENROUTER_API_KEY="$OPENROUTER_API_KEY" \
            SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            SUPABASE_SECRET_KEY="$SUPABASE_SECRET_KEY" \
            SUPABASE_KEY="$SUPABASE_KEY" \
            MAKE_WEBHOOK_URL="$MAKE_WEBHOOK_URL" \
            GEMINI_API_KEY="$GEMINI_API_KEY" \
            bash -s << 'DEPLOY_SCRIPT'
          set -euo pipefail
          echo "=== Inicio del deploy en el servidor ==="

          # --- Clonar/actualizar mayk-agents usando git+token ---
          AGENTS_DIR="/home/mayk/mayk-agents"
          AGENTS_REPO="https://x-access-token:${GH_PAT}@github.com/MaykNLD/mayk-agents.git"

          if [ -d "$AGENTS_DIR/.git" ]; then
            echo ">>> Actualizando mayk-agents..."
            cd "$AGENTS_DIR"
            git remote set-url origin "$AGENTS_REPO"
            git fetch origin
            git checkout -f main
            git reset --hard origin/main
            git clean -fd
          else
            echo ">>> Clonando mayk-agents desde cero..."
            rm -rf "$AGENTS_DIR"
            git clone "$AGENTS_REPO" "$AGENTS_DIR"
          fi

          # --- Preparar shared en cada agente (necesario para Docker build context) ---
          echo ">>> Preparando carpeta shared en cada agente..."
          cd "$AGENTS_DIR"
          for d in agente-*/; do
            # Copiar shared si no existe o está desactualizado
            rm -rf "${d}shared"
            cp -r shared "${d}shared"
            # Arreglar referencia ../shared en Dockerfiles
            if grep -q '\.\./shared' "${d}Dockerfile" 2>/dev/null; then
              sed -i 's|\.\./shared|shared|g' "${d}Dockerfile"
              echo "  Parcheado Dockerfile de $d"
            fi
          done

          # --- LIMPIEZA NUCLEAR: eliminar CUALQUIER contenedor mayk-dev primero ---
          echo ">>> Limpieza forzada de contenedores y redes anteriores..."
          cd /home/mayk/mayk-dev
          docker compose down -v --remove-orphans 2>/dev/null || true
          FORZAR_RM=$(docker ps -a --filter "name=mayk-dev" -q 2>/dev/null)
          if [ -n "$FORZAR_RM" ]; then
            echo "  Eliminando contenedores residuales: $FORZAR_RM"
            docker rm -f $FORZAR_RM
          fi
          docker network ls --filter "name=mayk-dev" -q | xargs -r docker network rm 2>/dev/null || true
          echo "  Limpieza OK"

          # Pausa de seguridad para que Docker libere recursos
          sleep 3

          # --- Desplegar con docker compose ---
          echo ">>> Iniciando docker compose..."
          cd /home/mayk/mayk-dev

          # Exportar variables de entorno para docker compose
          export OPENROUTER_API_KEY
          export SUPABASE_URL
          export SUPABASE_ANON_KEY
          export SUPABASE_SECRET_KEY
          export SUPABASE_KEY
          export MAKE_WEBHOOK_URL
          export GEMINI_API_KEY

          docker compose down --remove-orphans || true
          docker compose up -d --build --force-recreate --remove-orphans

          echo "=== Deploy completado ==="
          docker compose ps
          DEPLOY_SCRIPT

      # 7. Health check
      - name: Health check
        run: |
          echo "Esperando 20s para que arranquen los contenedores..."
          sleep 20
          echo "--- Verificando orquestador principal (8000) ---"
          curl -f --retry 3 --retry-delay 5 http://${{ secrets.HOST_IP }}:8000/health && echo "ORQUESTADOR OK"
          echo "--- Verificando career-orchestrator (8020) ---"
          curl -f --retry 3 --retry-delay 5 http://${{ secrets.HOST_IP }}:8020/health && echo "CAREER-ORCHESTRATOR OK"
