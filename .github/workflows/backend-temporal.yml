name: "🚀 Backend Temporal (Career-Ops)"
concurrency:
  group: backend-career-ops
  cancel-in-progress: true


on:
  workflow_dispatch:
    inputs:

      duration:

        description: 'Tiempo activo (horas)'
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '4'
          - '6'

jobs:
  run-backend-serverless:

    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ── 1. Checkout orquestadores ──
      - name: 📦 Clonar mayk-orchestrators
        uses: actions/checkout@v4
        with:
          path: mayk-orchestrators

      # ── 2. Checkout agentes ──
      - name: 📦 Clonar mayk-agents
        uses: actions/checkout@v4
        with:
          repository: MaykNLD/mayk-agents
          token: ${{ secrets.GH_PAT }}
          path: mayk-agents

      # ── 3. Tailscale (instalación manual — sin GitHub Action) ──
      - name: 🔒 Instalar y conectar Tailscale
        run: |
          # Instalar Tailscale
          curl -fsSL https://tailscale.com/install.sh | sh

          # Conectar con auth key (ephemeral: el nodo se elimina solo al terminar el job)
          sudo tailscale up \
            --auth-key="${{ secrets.TAILSCALE_AUTHKEY }}" \
            --hostname="mayk-backend" \
            --accept-routes \
            --accept-dns=false \
            --timeout=30s

          # Capturar IP y guardarla en el entorno del workflow
          TAILSCALE_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=${TAILSCALE_IP}" >> $GITHUB_ENV
          echo "✅ Tailscale conectado. IP: ${TAILSCALE_IP}"

      # ── 4. Preparar shared en cada agente ──
      - name: 🔧 Preparar shared en agentes
        working-directory: ./mayk-agents
        run: |
          echo ">>> Copiando shared en cada agente..."
          for d in agente-*/; do
            rm -rf "${d}shared"
            cp -r shared "${d}shared"
            if grep -q '\.\./shared' "${d}Dockerfile" 2>/dev/null; then
              sed -i 's|\.\./shared|shared|g' "${d}Dockerfile"
              echo "  Parcheado: ${d}Dockerfile"
            fi
          done
          echo ">>> shared OK"

      # ── 5. Build + arrancar contenedores ──
      - name: 🐳 Docker Compose up (con Secrets)
        working-directory: ./mayk-orchestrators
        env:
          OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_ANON_KEY:   ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAKE_WEBHOOK_URL:    ${{ secrets.MAKE_WEBHOOK_URL }}
          CAREER_API_KEY:      ${{ secrets.CAREER_API_KEY }}
        run: |
          docker compose -f docker-compose.career.yml up -d --build --remove-orphans
          echo "=== Estado de contenedores ==="
          docker compose -f docker-compose.career.yml ps

      # ── 6. Health check ──
      - name: 🏥 Health check career-orchestrator
        run: |
          echo "Esperando 40s a que levanten los contenedores..."
          sleep 40
          curl -sf http://localhost:8020/health \
            && echo "✅ career-orchestrator OK" \
            || echo "⚠️  career-orchestrator aún arrancando (normal en cold start)"

      # ── 7. Registrar URL en Supabase (para el dashboard) ──
      - name: 📡 Registrar backend URL en Supabase
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          BACKEND_URL="http://${TAILSCALE_IP}:8020"
          echo "Registrando URL: ${BACKEND_URL}"
          # Limpiar entradas anteriores
          curl -s -X DELETE "${SUPABASE_URL}/rest/v1/backend_status?status=eq.online" \
            -H "apikey: ${SUPABASE_SECRET_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}"
          # Registrar nueva URL
          curl -s -X POST "${SUPABASE_URL}/rest/v1/backend_status" \
            -H "apikey: ${SUPABASE_SECRET_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"url\": \"${BACKEND_URL}\", \"status\": \"online\"}"
          echo ""
          echo "✅ URL registrada en Supabase: ${BACKEND_URL}"

      # ── 8. Anunciar IP ──
      - name: 📣 Backend operativo
        run: |
          echo "========================================================="
          echo "🚀 CAREER-OPS BACKEND ESTÁ OPERATIVO 🚀"
          echo "Activo durante ${{ github.event.inputs.duration }} horas."
          echo ""
          echo "IP Tailscale:"
          tailscale ip -4
          echo "========================================================="

      # ── 9. Mantener servidor vivo (con captura de logs cada 60s) ──
      - name: ⏳ Mantener vivo
        working-directory: ./mayk-orchestrators
        run: |
          HOURS=${{ github.event.inputs.duration }}
          TOTAL_SECS=$((HOURS * 3600))
          ELAPSED=0
          echo "Servidor activo. Se apagará en ${HOURS}h."
          echo "Logs del career-orchestrator aparecerán cada 60s."
          while [ $ELAPSED -lt $TOTAL_SECS ]; do
            sleep 60
            ELAPSED=$((ELAPSED + 60))
            echo ""
            echo "=== [career-orchestrator logs — ${ELAPSED}s elapsed] ==="
            docker compose -f docker-compose.career.yml logs --tail=30 career-orchestrator 2>/dev/null || true
            echo "======================================================"
          done

      # ── 10. Cleanup: eliminar URL de Supabase al apagar ──
      - name: 🧹 Limpiar backend_status en Supabase
        if: always()
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          curl -s -X DELETE "${SUPABASE_URL}/rest/v1/backend_status?status=eq.online" \
            -H "apikey: ${SUPABASE_SECRET_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}"
          echo "✅ backend_status limpiado"