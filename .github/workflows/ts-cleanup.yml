name: Tailscale Cleanup Debug
on: [workflow_dispatch]
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup Offline Nodes
        env:
          TAILSCALE_API_KEY: ${{ secrets.TAILSCALE_KEY_API }}
        run: |
          echo "Fetching Tailscale devices..."
          DEVICES=$(curl -s -X GET "https://api.tailscale.com/api/v2/tailnet/-/devices" -u "${TAILSCALE_API_KEY}:")
          echo "Response length: $(echo "$DEVICES" | wc -c)"
          echo "Response: $(echo "$DEVICES" | cut -c 1-200)"