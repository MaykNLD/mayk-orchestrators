name: Tailscale Cleanup Actual
on: [workflow_dispatch]
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup Offline Nodes
        env:
          TAILSCALE_API_KEY: ${{ secrets.TAILSCALE_KEY_API }}
        run: |
          echo "Fetching Tailscale devices..."
          DEVICES=$(curl -s -X GET "https://api.tailscale.com/api/v2/tailnet/-/devices" -u "${TAILSCALE_API_KEY}:")
          
          echo "Filtering devices..."
          echo "$DEVICES" | jq -r '.devices[] | select(.lastSeen != null) | select(.hostname | startswith("github-runnervm") or startswith("mayk-backend")) | .id' > devices.txt
          
          COUNT=$(wc -l < devices.txt)
          echo "Found $COUNT devices to delete."
          
          while read -r id; do
            if [ -n "$id" ]; then
              echo "Deleting device $id..."
              curl -s -X DELETE "https://api.tailscale.com/api/v2/device/$id" -u "${TAILSCALE_API_KEY}:"
            fi
          done < devices.txt
          echo "Cleanup complete!"